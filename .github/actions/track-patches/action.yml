name: Track deb.sury.org patches
description: >
  For each EOL version in eol/, compares the deb.sury.org revision in its Dockerfiles' PHP_PATCHES
  with deb.sury.org's latest build, and opens or updates an issue naming the Salsa commit with the
  build's debian/patches when they differ.

inputs:
  token:
    description: Token used to read and write the repository's issues.
    default: ${{ github.token }}
  distribution:
    description: Debian release whose deb.sury.org source index is read.
    default: trixie

runs:
  using: node24
  main: index.mjs
