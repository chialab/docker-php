name: Test PHP 5 images

on:
  schedule:
    # chosen by fair dice roll
    - cron: '42 18 * * 5'
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  test-5:
    name: Build and test PHP 5 images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      versions: '["5.6"]'
      flavors: '["", "-apache", "-fpm"]'
    secrets:
      pull-username: ${{ secrets.DOCKER_PULL_USER_1 }}
      pull-password: ${{ secrets.DOCKER_PULL_PASS_1 }}
