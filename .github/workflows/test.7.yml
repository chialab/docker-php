name: Test PHP 7 images

on:
  schedule:
    # chosen by fair dice roll
    - cron: '42 18 * * 4'
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  test-7:
    name: Build and test PHP 7 images
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]') && !contains(github.event.commits[0].message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      versions: '["7.0", "7.1", "7.2", "7.3", "7.4"]'
      flavors: '["", "-apache", "-fpm", "-alpine", "-fpm-alpine"]'
      exclude: '[{"version": "7.0", "flavor": "-alpine"}, {"version": "7.0", "flavor": "-fpm-alpine"}]'
    secrets:
      pull-username: ${{ secrets.DOCKER_PULL_USER_2 }}
      pull-password: ${{ secrets.DOCKER_PULL_PASS_2 }}
