name: Test PHP 8 images

on:
  schedule:
    # chosen by fair dice roll
    - cron: '42 18 * * 3'
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  test-8:
    name: Build and test PHP 8 images
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]') && !contains(github.event.commits[0].message, '[ci skip]') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      versions: '["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]'
      flavors: '["", "-apache", "-fpm", "-alpine", "-fpm-alpine"]'
    secrets:
      pull-username: ${{ secrets.DOCKER_PULL_USER_3 }}
      pull-password: ${{ secrets.DOCKER_PULL_PASS_3 }}
