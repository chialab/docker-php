name: Publish PHP 5 images

on:
  workflow_run:
    workflows: ["Test PHP 5 images"]
    branches: [main]
    types: [completed]

jobs:
  publish-5:
    name: Publish PHP 5 images
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && !contains(github.event.workflow_run.head_commit.message, '[skip ci]') && !contains(github.event.workflow_run.head_commit.message, '[ci skip]') }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      versions: '["5.6"]'
      flavors: '["", "-apache", "-fpm"]'
    secrets:
      push-username: ${{ secrets.DOCKER_USERNAME }}
      push-password: ${{ secrets.DOCKER_PASSWORD }}
