name: Publish compatibility images

on:
  workflow_run:
    workflows: ["Test compatibility images"]
    branches: [main]
    types: [completed]

# Every completed test run starts this workflow; runs that won't publish get their own group, so
# they can't cancel a publish in progress.
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha == github.sha && github.workflow || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-compat:
    name: Build and publish compatibility images
    runs-on: ubuntu-22.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha == github.sha }}
    strategy:
      fail-fast: false
      matrix:
        version: [ '5.6' ]
        flavor: [ '', '-apache', '-fpm' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to DockerHub (pull)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_PULL_USER_4 }}
          password: ${{ secrets.DOCKER_PULL_PASS_4 }}

      - name: Pull base image
        run: docker pull debian:stretch-slim

      - name: Login to DockerHub (push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to registry
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
#          cache-from: type=registry,ref=ghcr.io/chialab/php-compat:${{ matrix.version }}${{ matrix.flavor }}
          cache-to: type=inline
          context: ./compat
          build-contexts: patches=eol/patches
          file: ${{ format('compat/{0}.{1}{2}', 'Dockerfile', matrix.version, matrix.flavor) }}
          tags: |
            chialab/php-compat:${{ matrix.version }}${{ matrix.flavor }}
            ghcr.io/chialab/php-compat:${{ matrix.version }}${{ matrix.flavor }}
          push: true
