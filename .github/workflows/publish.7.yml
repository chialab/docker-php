name: Publish PHP 7 images

on:
  workflow_run:
    workflows: ["Test PHP 7 images"]
    branches: [main]
    types: [completed]

jobs:
  publish-7:
    name: Publish PHP 7 images
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha == github.sha }}
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      versions: '["7.0", "7.1", "7.2", "7.3", "7.4"]'
      flavors: '["", "-apache", "-fpm", "-alpine", "-fpm-alpine"]'
      exclude: '[{"version": "7.0", "flavor": "-alpine"}, {"version": "7.0", "flavor": "-fpm-alpine"}]'
    secrets:
      push-username: ${{ secrets.DOCKER_USERNAME }}
      push-password: ${{ secrets.DOCKER_PASSWORD }}
